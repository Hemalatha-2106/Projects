

<html>
<head>
    <title>My Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f50ebb;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 30px auto;
            background: rgb(238, 202, 230);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
        }
        h2 { text-align: center; }
        label {
            display: block;
            margin-top: 15px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }
        button, .link {
            display: inline-block;
            margin-top: 18px;
            padding: 11px 16px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }
        .message { color: #1769aa; }
    </style>
</head>
<body>
    <div class="container">
        <h2>My Profile</h2>

        {% if messages %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Full Name</label>
            <input type="text" name="name"
                   value="{{ request.user.first_name }}" required>

            <label>Email</label>
            <input type="email" name="email"
                   value="{{ request.user.email }}" required>

            <label>Phone Number</label>
            <input type="text" name="phone"
                   value="{{ profile.phone }}" required>

            <button type="submit">Save Profile</button>
        </form>

        <a class="link" href="{% url 'manage_address' %}">
            Manage Address
        </a>
        <a class="link" href="{% url 'product_list' %}">
            Back to Shop
        </a>
    </div>
</body>
</html>
