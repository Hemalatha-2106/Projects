

<html>
<head>

    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #5e87df;
            padding: 30px;
        }
        .container {
            max-width: 400px;
            margin: 40px auto;
            padding: 25px;
            background: rgb(146, 207, 223);
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .error { color: #c62828; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Login to Your Account</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">Login</button>
        </form>

        <p>Don't have an account?
            <a href="{% url 'signup' %}">Sign Up</a>
        </p>
    </div>
</body>
</html>
