<html>
<head>
    
    <title>Manage Address</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #dd5f0a;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            background: rgb(252, 181, 181);
            border-radius: 10px;
            box-shadow: 0 2px 10px #ddd;
        }
        h2 { text-align: center; }
        label {
            display: block;
            margin-top: 15px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
        }
        textarea { min-height: 100px; }
        button, a {
            display: inline-block;
            margin-top: 18px;
            padding: 11px 16px;
            background-color: #10b9d6;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }
        .message { color: #1769aa; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Manage Delivery Address</h2>

        {% if messages %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Address</label>
            <textarea name="address" required>{{ profile.address }}</textarea>

            <label>City</label>
            <input type="text" name="city"
                   value="{{ profile.city }}" required>

            <label>PIN Code</label>
            <input type="text" name="pincode"
                   value="{{ profile.pincode }}"
                   pattern="[0-9]{6}" maxlength="6"
                   title="Enter a 6-digit PIN code" required>

            <button type="submit">Save Address</button>
        </form>

        <a href="{% url 'profile' %}">Back to Profile</a>
        <a href="{% url 'product_list' %}">Back to Shop</a>
    </div>
</body>
</html>
