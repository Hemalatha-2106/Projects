
{% load static %}
<html>
<head>
    <title>Student List</title>
    <link rel="stylesheet" href="{% static 'placements/style.css' %}">
</head>
<body>
    <div class="container">
        <h2>Student Details</h2>

        <table>
            <tr>
                <th>Name</th>
                <th>Register Number</th>
                <th>Department</th>
                <th>CGPA</th>
            </tr>

            {% for student in students %}
            <tr>
                <td>{{ student.name }}</td>
                <td>{{ student.register_number }}</td>
                <td>{{ student.department }}</td>
                <td>{{ student.cgpa }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No students added yet.</td>
            </tr>
            {% endfor %}
        </table>

        <br>
        <a href="/add-student/">Add Student</a>
        <a href="/">Home</a>
    </div>
</body>
</html>
