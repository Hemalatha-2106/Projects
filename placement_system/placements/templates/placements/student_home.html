
{% load static %}
<html>
<head>
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="{% static 'placements/style.css' %}">
</head>
<body>
    <div class="container">
        <h1>Welcome, {{ request.user.username }}!</h1>

        <p>You have successfully logged in.</p>

        <a href="{% url 'view_companies' %}">View Companies</a><br><br>

        <br><br>

        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
    </div>
</body>
</html>
